name: macOS Build and Test

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  macos-build:
    name: Build and Test (macOS)
    runs-on: macos-latest
    env:
      WOLFSSL_SRC: ${{ github.workspace }}/wolfssl
      WOLFSSL_PREFIX: ${{ github.workspace }}/wolfssl-install
      WOLFSSL_SERVER: ${{ github.workspace }}/wolfssl/examples/server/server
      DYLD_LIBRARY_PATH: ${{ github.workspace }}/wolfssl-install/lib
    steps:
      - uses: actions/checkout@v4

      - name: Install Build Prerequisites
        run: |
          brew install autoconf libtool automake
          brew install go

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macos-cargo-

      - name: Checkout wolfSSL master
        uses: actions/checkout@v4
        with:
          repository: wolfSSL/wolfssl
          path: wolfssl

      - name: Build and install wolfSSL
        working-directory: wolfssl
        run: |
          ./autogen.sh
          ./configure --prefix="$WOLFSSL_PREFIX" \
            --enable-all-crypto --enable-shared --disable-static \
            CPPFLAGS=-DWOLFSSL_RSA_KEY_CHECK
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Use the wolfCrypt crate from wolfSSL master
        run: |
          mkdir -p .cargo
          printf '[patch."https://github.com/wolfSSL/wolfssl"]\nwolfssl-wolfcrypt = { path = "%s/wrapper/rust/wolfssl-wolfcrypt" }\n' \
            "$WOLFSSL_SRC" > .cargo/config.toml

      - name: Build and Test rustls-wolfcrypt-provider
        run: |
          cd rustls-wolfcrypt-provider
          make build
          make test
          make test-quic
          make test-std

      - name: Check formatting
        run: |
          cd rustls-wolfcrypt-provider
          cargo fmt --all -- --check

      - name: Run clippy
        run: |
          cd rustls-wolfcrypt-provider
          cargo clippy --all-features -- -D warnings
